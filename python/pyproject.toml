[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvfc"
version = "0.3.0"
description = "Python SDK for dvfc, author Chart/Dash IR, validate natively, compile dbt metrics, build via Mosaic CLI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Data Viz Factory contributors"}
]
keywords = [
    "dashboard",
    "analytics",
    "mosaic",
    "dbt",
    "metricflow",
    "visualization",
    "crossfilter",
    "vega-lite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# In-process MetricFlow (versions vary; install what matches your dbt project)
metricflow = [
    "metricflow>=0.200.0",
]
# In-process SVG/PNG without Node
render = [
    "vl-convert-python>=1.0.0",
]
toml = [
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
    "dvfc[toml,render]",
]
all = [
    "dvfc[metricflow,render,toml]",
]

[project.urls]
Homepage = "https://github.com/KobaKhit/dvfc"
Documentation = "https://github.com/KobaKhit/dvfc/tree/main/python"
Repository = "https://github.com/KobaKhit/dvfc"
Issues = "https://github.com/KobaKhit/dvfc/issues"

[project.scripts]
dvfc-py = "dvfc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dvfc*"]

[tool.setuptools.package-data]
dvfc = ["py.typed", "schema/*.json"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
