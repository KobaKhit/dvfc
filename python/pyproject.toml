[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvfc"
version = "0.1.0"
description = "Python SDK for Data Viz Factory - Cross-filtered boards for humans and agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Data Viz Factory contributors"}
]
keywords = ["dashboard", "analytics", "mosaic", "dbt", "visualization", "crossfilter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0"
]

[project.urls]
Homepage = "https://github.com/dvfc/dvfc"
Documentation = "https://github.com/dvfc/dvfc#readme"
Repository = "https://github.com/dvfc/dvfc"

[tool.setuptools.packages.find]
where = ["."]
include = ["dvfc*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
