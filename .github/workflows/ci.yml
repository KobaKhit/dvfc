name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Build packages
      run: pnpm run build

    - name: Run unit tests
      run: |
        pnpm --filter @dvfc/core test
        pnpm --filter @dvfc/charts test
        pnpm --filter @dvfc/resolve test
        pnpm --filter @dvfc/render-vega test

    - name: Validate chart/dash examples
      run: |
        node packages/cli/dist/cli.js validate examples/charts/revenue_trend.chart.yaml
        node packages/cli/dist/cli.js validate examples/dashes/sales.dash.yaml
        node packages/cli/dist/cli.js validate examples/sales-board/sales.dash.yaml
        node packages/cli/dist/cli.js validate examples/web-analytics/web-analytics.dash.yaml
        node packages/cli/dist/cli.js validate examples/dbt-jaffle/jaffle.dash.yaml
        # Legacy board still accepted (deprecated)
        node packages/cli/dist/cli.js validate examples/sales-board/board.yaml

    - name: Test chart discovery + compose
      run: |
        node packages/cli/dist/cli.js charts types
        node packages/cli/dist/cli.js charts search revenue
        node packages/cli/dist/cli.js charts list
        node packages/cli/dist/cli.js dash compose --charts revenue_trend -o /tmp/ci-composed.dash.yaml
        node packages/cli/dist/cli.js validate /tmp/ci-composed.dash.yaml

    - name: Test HTML + SVG/PNG builds
      run: |
        node packages/cli/dist/cli.js build examples/charts/revenue_trend.chart.yaml -o /tmp/ci-chart-html --format html
        test -f /tmp/ci-chart-html/index.html
        node packages/cli/dist/cli.js build examples/charts/revenue_trend.chart.yaml -o /tmp/ci-chart.svg --format svg
        test -f /tmp/ci-chart.svg
        node packages/cli/dist/cli.js build examples/sales-board/sales.dash.yaml -o /tmp/ci-dash-html --format html
        test -f /tmp/ci-dash-html/index.html

    - name: Check for node_modules in git
      run: |
        if git ls-files | grep -q 'node_modules/'; then
          echo "Error: node_modules found in git"
          exit 1
        fi
        echo "✓ No node_modules in git"

    - name: Python SDK tests
      run: |
        cd python
        pip install -e .
        python3 -c "from dvfc import DashboardBuilder, Chart, Dash, DataVizFactoryClient; print('✓ Python SDK imports')"
        python3 smoke_test.py
