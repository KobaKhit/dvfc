name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Build packages
      # Adapters live under experiments/; @dvfc/resolve removed — not in pnpm-workspace.yaml
      run: pnpm run build

    - name: Verify schemas present and in sync
      run: |
        test -f packages/core/schema/chart.json
        test -f python/dvfc/schema/chart.json
        diff -q packages/core/schema/chart.json python/dvfc/schema/chart.json
        diff -q packages/core/schema/dash.json python/dvfc/schema/dash.json
        diff -q packages/core/schema/dashboard-spec.json python/dvfc/schema/dashboard-spec.json

    - name: Lint
      run: pnpm run lint

    - name: Run unit tests
      run: |
        pnpm --filter @dvfc/core test
        pnpm --filter @dvfc/charts test
        pnpm --filter @dvfc/render-vega test
        pnpm --filter @dvfc/build test
        pnpm --filter @dvfc/render-mosaic test
        pnpm --filter @dvfc/render-dc test
        pnpm --filter @dvfc/mcp test

    - name: Validate chart/dash examples
      run: |
        node packages/cli/dist/cli.js validate examples/charts/revenue_trend.chart.yaml
        node packages/cli/dist/cli.js validate examples/dashes/sales.dash.yaml
        node packages/cli/dist/cli.js validate examples/sales-dash/sales.dash.yaml
        node packages/cli/dist/cli.js validate examples/web-analytics/web-analytics.dash.yaml
        node packages/cli/dist/cli.js validate examples/dbt-jaffle/jaffle.dash.yaml
        node packages/cli/dist/cli.js validate examples/dbt-jaffle/pie.dash.yaml
        node packages/cli/dist/cli.js validate examples/revenue-analysis/revenue-analysis.dash.yaml

    - name: Test chart discovery + compose
      run: |
        node packages/cli/dist/cli.js charts types
        node packages/cli/dist/cli.js charts search revenue
        node packages/cli/dist/cli.js charts list
        node packages/cli/dist/cli.js dash compose --charts charts__revenue_trend -o /tmp/ci-composed.dash.yaml
        node packages/cli/dist/cli.js validate /tmp/ci-composed.dash.yaml
        node packages/cli/dist/cli.js normalize /tmp/ci-composed.dash.yaml > /tmp/ci-composed.normalized.yaml
        test -s /tmp/ci-composed.normalized.yaml

    - name: Test HTML + SVG/PNG builds
      run: |
        node packages/cli/dist/cli.js build examples/charts/revenue_trend.chart.yaml -o /tmp/ci-chart-html --format html
        test -f /tmp/ci-chart-html/index.html
        node packages/cli/dist/cli.js build examples/charts/revenue_trend.chart.yaml -o /tmp/ci-chart.svg --format svg
        test -f /tmp/ci-chart.svg
        node packages/cli/dist/cli.js build examples/sales-dash/sales.dash.yaml -o /tmp/ci-dash-html --format html
        test -f /tmp/ci-dash-html/index.html

    - name: Check for node_modules in git
      run: |
        if git ls-files | grep -q 'node_modules/'; then
          echo "Error: node_modules found in git"
          exit 1
        fi
        echo "✓ No node_modules in git"

    - name: Setup uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Python SDK tests
      working-directory: python
      run: |
        uv sync --extra dev
        uv run pytest -q
        uv run mypy dvfc --ignore-missing-imports
        uv run python smoke_test.py
        uv run dvfc-py validate ../examples/charts/revenue_trend.chart.yaml
