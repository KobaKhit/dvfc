# Dash IR — Revenue analysis with overlays, KPI, scatter, donut, heatmap, and narrative text.

id: revenue-analysis
title: Revenue Analysis with Insights
description: Overlays, narrative text, KPI, scatter, donut, and heatmap on daily revenue metrics
version: 0.4.0
meta:
  title: Revenue Analysis with Insights
  description: Overlays, narrative text, KPI, scatter, donut, and heatmap on daily revenue metrics
  version: 0.4.0
data:
  - id: daily_metrics
    type: dbt
    model: daily_metrics
charts:
  - id: intro_text
    type: text
    title: Revenue analysis Q1
    content: >
      ## Executive summary


      This dashboard analyzes **Q1 revenue performance** with analysis overlays,
      crossfiltered views, and a mix of chart types.


      **Overlays on the trend:**

      - Red dashed line = average revenue

      - Blue dotted line = linear trend

      - Purple line = 7-day moving average


      Brush the revenue area chart to filter every other view.
  - id: revenue_kpi
    type: number
    title: Total revenue
    dataSource: daily_metrics
    encoding:
      y:
        field: revenue
        type: quantitative
        aggregate: sum
        label: Revenue
    interaction:
      filterBy: dateBrush
    width: 280
    height: 160

  - id: profit_kpi
    type: number
    title: Total profit
    dataSource: daily_metrics
    encoding:
      y:
        field: profit
        type: quantitative
        aggregate: sum
        label: Profit
    interaction:
      filterBy: dateBrush
    width: 280
    height: 160

  - id: revenue_trend
    type: area
    title: Daily revenue with analysis overlays
    dataSource: daily_metrics
    encoding:
      x:
        field: date
        type: temporal
        label: Date
      y:
        field: revenue
        type: quantitative
        label: Revenue
    interaction:
      brush: true
      brushAxis: x
      selection: dateBrush
      publishes: dateBrush
    overlays:
      - type: mean
        color: "#e53e3e"
        label: Average revenue
      - type: trend
        color: "#3182ce"
        label: Linear trend
      - type: moving_average
        window: 7
        color: "#805ad5"
        label: 7-day MA
    width: 800
    height: 300

  - id: insight_text
    type: text
    content: >
      ### Key insights


      Revenue shows a **strong upward trend** through the quarter, with the
      7-day moving average smoothing daily volatility.


      Brush a date range to update KPIs, regional mix, and the cost–revenue
      scatter in lockstep.
  - id: profit_analysis
    type: line
    title: Profit trend (mean and 5-day MA)
    dataSource: daily_metrics
    encoding:
      x:
        field: date
        type: temporal
        label: Date
      y:
        field: profit
        type: quantitative
        label: Profit
    interaction:
      brush: true
      brushAxis: x
      selection: dateBrush
      filterBy: dateBrush
      publishes: dateBrush
    overlays:
      - type: mean
        color: "#48bb78"
        label: Avg profit
      - type: moving_average
        window: 5
        color: "#ed8936"
        label: 5-day MA
    width: 800
    height: 250

  - id: region_mix
    type: donut
    title: Revenue by region
    dataSource: daily_metrics
    encoding:
      x:
        field: region
        type: nominal
        label: Region
      y:
        field: revenue
        type: quantitative
        aggregate: sum
        label: Revenue
    interaction:
      filterBy: dateBrush
      publishes: dateBrush
      select: auto
    width: 360
    height: 300

  - id: regional_breakdown
    type: bar
    title: Revenue by region
    dataSource: daily_metrics
    encoding:
      x:
        field: region
        type: nominal
        label: Region
      y:
        field: revenue
        type: quantitative
        aggregate: sum
        label: Revenue
      color:
        field: region
        type: nominal
    interaction:
      filterBy: dateBrush
    width: 400
    height: 260

  - id: cost_vs_revenue
    type: scatter
    title: Cost vs revenue
    dataSource: daily_metrics
    encoding:
      x:
        field: cost
        type: quantitative
        label: Cost
      y:
        field: revenue
        type: quantitative
        label: Revenue
      color:
        field: region
        type: nominal
    interaction:
      filterBy: dateBrush
    width: 420
    height: 280

  - id: region_date_heatmap
    type: heatmap
    title: Region × date revenue
    dataSource: daily_metrics
    encoding:
      x:
        field: region
        type: nominal
        label: Region
      y:
        field: date
        type: temporal
        label: Date
      color:
        field: revenue
        type: quantitative
        aggregate: sum
        label: Revenue
    interaction:
      filterBy: dateBrush
    width: 520
    height: 320

  - id: revenue_histogram
    type: histogram
    title: Daily revenue distribution
    dataSource: daily_metrics
    encoding:
      x:
        field: revenue
        type: quantitative
        label: Revenue
    interaction:
      filterBy: dateBrush
    width: 420
    height: 260

  - id: cost_analysis
    type: line
    title: Cost trend (median reference)
    dataSource: daily_metrics
    encoding:
      x:
        field: date
        type: temporal
        label: Date
      y:
        field: cost
        type: quantitative
        label: Cost
    interaction:
      filterBy: dateBrush
    overlays:
      - type: median
        color: "#ed64a6"
        label: Median cost
    width: 400
    height: 250

  - id: summary_text
    type: text
    content: |
      ### Methodology

      **Overlays explained:**
      - *Mean* (horizontal line) = average across points in the filtered range
      - *Median* (horizontal line) = middle value when sorted
      - *Trend* (diagonal line) = linear regression best fit
      - *Moving average* (smooth line) = rolling average over N days

      Overlays and KPIs update when you brush charts.
layout:
  type: grid
  columns: 2
  gap: 24
theme:
  colors:
    - "#1e3a5f"
    - "#7ba3c9"
    - "#a89b8c"
    - "#4a7c9b"
  fontFamily: system-ui, -apple-system, "Segoe UI", sans-serif
  backgroundColor: white
  chartBorders: true
coordination:
  auto: true
