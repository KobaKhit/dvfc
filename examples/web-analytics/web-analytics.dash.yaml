# Dash IR — Web analytics gallery demo
# Area, KPI, donut, scatter, density, heatmap, and bar with date-brush coordination.

id: web-analytics
title: Web Analytics Dashboard
description: Traffic and conversion analytics with area, KPI, donut, scatter, density, and heatmap charts
version: 0.2.0
meta:
  title: Web Analytics Dashboard
  description: Traffic and conversion analytics with area, KPI, donut, scatter, density, and heatmap charts
  version: 0.2.0
data:
  - id: page_views
    type: dbt
    model: page_views
  - id: conversions
    type: dbt
    model: conversions
charts:
  - id: views_kpi
    type: number
    title: Total page views
    dataSource: page_views
    encoding:
      y:
        field: views
        type: quantitative
        aggregate: sum
        label: Views
    interaction:
      filterBy: dateBrush
    width: 280
    height: 160

  - id: daily_views
    type: area
    title: Daily page views (brush to filter)
    dataSource: page_views
    encoding:
      x:
        field: date
        type: temporal
        label: Date
      y:
        field: views
        type: quantitative
        aggregate: sum
        label: Views
    interaction:
      brush: true
      brushAxis: x
      publishes: dateBrush
      filterBy: dateBrush
    width: 640
    height: 240

  - id: views_by_page
    type: bar
    title: Views by page
    dataSource: page_views
    encoding:
      x:
        field: page
        type: nominal
        label: Page
      y:
        field: views
        type: quantitative
        aggregate: sum
        label: Total views
    interaction:
      publishes: dateBrush
      select: auto
      filterBy: dateBrush
    width: 420
    height: 280

  - id: bounce_scatter
    type: scatter
    title: Bounce rate vs session duration
    dataSource: page_views
    encoding:
      x:
        field: avg_duration
        type: quantitative
        label: Avg duration (s)
      y:
        field: bounce_rate
        type: quantitative
        label: Bounce rate
      color:
        field: page
        type: nominal
    interaction:
      publishes: dateBrush
      select: auto
      filterBy: dateBrush
    width: 420
    height: 280

  - id: duration_density
    type: density
    title: Session duration density
    dataSource: page_views
    encoding:
      x:
        field: avg_duration
        type: quantitative
        label: Avg duration (s)
      y:
        field: density
        type: quantitative
        label: Density
    interaction:
      filterBy: dateBrush
    width: 420
    height: 260

  - id: page_session_heatmap
    type: heatmap
    title: Page × sessions intensity
    dataSource: page_views
    encoding:
      x:
        field: page
        type: nominal
        label: Page
      y:
        field: date
        type: temporal
        label: Date
      color:
        field: sessions
        type: quantitative
        aggregate: sum
        label: Sessions
    interaction:
      publishes: dateBrush
      select: auto
      filterBy: dateBrush
    width: 520
    height: 300

  - id: revenue_kpi
    type: number
    title: Total revenue
    dataSource: conversions
    encoding:
      y:
        field: revenue
        type: quantitative
        aggregate: sum
        label: Revenue ($)
    interaction:
      filterBy: revenueBrush
    width: 280
    height: 160

  - id: daily_revenue
    type: area
    title: Daily revenue (brush to filter)
    dataSource: conversions
    encoding:
      x:
        field: date
        type: temporal
        label: Date
      y:
        field: revenue
        type: quantitative
        aggregate: sum
        label: Revenue ($)
    interaction:
      brush: true
      brushAxis: x
      publishes: revenueBrush
      filterBy: revenueBrush
    width: 640
    height: 240

  - id: source_mix
    type: donut
    title: Revenue by traffic source
    dataSource: conversions
    encoding:
      x:
        field: source
        type: nominal
        label: Source
      y:
        field: revenue
        type: quantitative
        aggregate: sum
        label: Revenue ($)
    interaction:
      filterBy: revenueBrush
      publishes: revenueBrush
      select: auto
    width: 360
    height: 300

  - id: cost_vs_revenue
    type: scatter
    title: Cost vs revenue by source
    dataSource: conversions
    encoding:
      x:
        field: cost
        type: quantitative
        label: Cost ($)
      y:
        field: revenue
        type: quantitative
        label: Revenue ($)
      color:
        field: source
        type: nominal
    interaction:
      publishes: revenueBrush
      select: auto
      filterBy: revenueBrush
    width: 420
    height: 280

  - id: conversions_by_source
    type: bar
    title: Conversions by source
    dataSource: conversions
    encoding:
      x:
        field: source
        type: nominal
        label: Source
      y:
        field: conversions
        type: quantitative
        aggregate: sum
        label: Conversions
    interaction:
      publishes: revenueBrush
      select: auto
      filterBy: revenueBrush
    width: 420
    height: 260

layout:
  type: flex
  gap: 20
theme:
  colors:
    - "#1e3a5f"
    - "#7ba3c9"
    - "#a89b8c"
    - "#4a7c9b"
  fontFamily: system-ui, -apple-system, "Segoe UI", sans-serif
  backgroundColor: white
  chartBorders: true
coordination:
  auto: true
