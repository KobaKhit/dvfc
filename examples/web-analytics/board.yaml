meta:
  title: "Web Analytics Dashboard"
  description: "Track page views, traffic sources, and conversion metrics"
  version: "0.1.0"

data:
  - id: page_views
    type: dbt
    model: page_views

  - id: conversions
    type: dbt
    model: conversions

charts:
  # Traffic Overview
  - id: daily_views
    type: line
    dataSource: page_views
    title: "Daily Page Views"
    encoding:
      x:
        field: date
        type: temporal
        label: "Date (brush to filter)"
      y:
        field: views
        type: quantitative
        aggregate: sum
        label: "Total Views"
    interaction:
      brush: true
      brushAxis: x
      selection: dateBrush
    width: 700
    height: 250

  - id: views_by_page
    type: bar
    dataSource: page_views
    title: "Views by Page"
    encoding:
      x:
        field: page
        type: nominal
        label: "Page"
      y:
        field: views
        type: quantitative
        aggregate: sum
        label: "Total Views"
      color: "steelblue"
    interaction:
      filterBy: dateBrush
    width: 700
    height: 300

  - id: bounce_rate
    type: bar
    dataSource: page_views
    title: "Average Bounce Rate by Page"
    encoding:
      x:
        field: page
        type: nominal
        label: "Page"
      y:
        field: bounce_rate
        type: quantitative
        aggregate: avg
        label: "Avg Bounce Rate"
      color: "crimson"
    interaction:
      filterBy: dateBrush
    width: 700
    height: 300

  # Conversion Metrics
  - id: daily_revenue
    type: line
    dataSource: conversions
    title: "Daily Revenue"
    encoding:
      x:
        field: date
        type: temporal
        label: "Date (brush to filter)"
      y:
        field: revenue
        type: quantitative
        aggregate: sum
        label: "Total Revenue ($)"
    interaction:
      brush: true
      brushAxis: x
      selection: revenueBrush
    width: 700
    height: 250

  - id: revenue_by_source
    type: bar
    dataSource: conversions
    title: "Revenue by Traffic Source"
    encoding:
      x:
        field: source
        type: nominal
        label: "Source"
      y:
        field: revenue
        type: quantitative
        aggregate: sum
        label: "Total Revenue ($)"
      color: "darkorange"
    interaction:
      filterBy: revenueBrush
    width: 700
    height: 300

  - id: conversion_rate
    type: bar
    dataSource: conversions
    title: "Conversions by Source"
    encoding:
      x:
        field: source
        type: nominal
        label: "Source"
      y:
        field: conversions
        type: quantitative
        aggregate: sum
        label: "Total Conversions"
      color: "mediumseagreen"
    interaction:
      filterBy: revenueBrush
    width: 700
    height: 300

layout:
  type: flex
  gap: 24

theme:
  colors:
    - "steelblue"
    - "crimson"
    - "darkorange"
    - "mediumseagreen"
  fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  backgroundColor: "white"
