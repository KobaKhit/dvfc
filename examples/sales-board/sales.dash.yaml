# Dash IR (canonical). Legacy board.yaml is deprecated; use this file for validate/preview/build.

id: sales-board
title: Sales & Flights Analytics
description: Multi-chart dashboard demonstrating Mosaic crossfiltering with dbt models
version: 0.1.0
meta:
  title: Sales & Flights Analytics
  description: Multi-chart dashboard demonstrating Mosaic crossfiltering with dbt models
  version: 0.1.0
data:
  - id: sales_daily
    type: dbt
    model: sales_daily
  - id: flights_summary
    type: dbt
    model: flights_summary
charts:
  - id: sales_trend
    type: line
    title: Daily Sales Trend
    dataSource: sales_daily
    encoding:
      x:
        field: date
        type: temporal
        label: Date (brush here to filter)
      y:
        field: sales
        type: quantitative
        aggregate: sum
        label: Daily Sales ($)
    interaction:
      brush: true
      brushAxis: x
      selection: salesBrush
      publishes: salesBrush
    width: 600
    height: 250
  - id: sales_by_region
    type: bar
    title: Sales by Region
    dataSource: sales_daily
    encoding:
      x:
        field: region
        type: nominal
        label: Region
      y:
        field: sales
        type: quantitative
        aggregate: sum
        label: Total Sales ($)
      color: steelblue
    interaction:
      filterBy: salesBrush
    width: 600
    height: 300
  - id: sales_by_product
    type: bar
    title: Sales by Product
    dataSource: sales_daily
    encoding:
      x:
        field: product
        type: nominal
        label: Product
      y:
        field: sales
        type: quantitative
        aggregate: sum
        label: Total Sales ($)
      color: darkorange
    interaction:
      filterBy: salesBrush
    width: 600
    height: 300
  - id: passenger_trend
    type: line
    title: Daily Passengers
    dataSource: flights_summary
    encoding:
      x:
        field: date
        type: temporal
        label: Date (brush here to filter)
      y:
        field: passengers
        type: quantitative
        aggregate: sum
        label: Daily Passengers
    interaction:
      brush: true
      brushAxis: x
      selection: flightsBrush
      publishes: flightsBrush
    width: 600
    height: 250
  - id: flights_by_origin
    type: bar
    title: Flights by Origin
    dataSource: flights_summary
    encoding:
      x:
        field: origin
        type: nominal
        label: Origin Airport
      y:
        field: flights
        type: quantitative
        aggregate: sum
        label: Total Flights
      color: mediumpurple
    interaction:
      filterBy: flightsBrush
    width: 600
    height: 300
  - id: delay_by_origin
    type: bar
    title: Average Delay by Origin
    dataSource: flights_summary
    encoding:
      x:
        field: origin
        type: nominal
        label: Origin Airport
      y:
        field: delay_minutes
        type: quantitative
        aggregate: avg
        label: Avg Delay (minutes)
      color: crimson
    interaction:
      filterBy: flightsBrush
    width: 600
    height: 300
layout:
  type: flex
  gap: 24
theme:
  colors:
    - steelblue
    - darkorange
    - mediumpurple
    - crimson
  fontFamily: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif
  backgroundColor: white
coordination:
  auto: true
