id = "cosmic-landing"
title = "Other Worlds"
description = "Brush the timeline, click a slice, or brush the scatter — every view stays in sync."
version = "0.2.0"

[coordination]
auto = true

[[data]]
id = "worlds"
type = "csv"
path = "exoplanets.csv"

[[charts]]
id = "field_note"
type = "text"
content = """
**Brush the timeline** to filter every view.

Click a donut slice or brush the scatter — linking is declared in the spec, not wired in JavaScript.
"""

[[charts]]
id = "world_count"
type = "number"
title = "Worlds in view"
dataSource = "worlds"

[charts.encoding.y]
field = "planet"
aggregate = "count"
label = "Count"

[charts.interaction]
filterBy = "era"

[[charts]]
id = "avg_habitability"
type = "number"
title = "Avg habitability"
dataSource = "worlds"

[charts.encoding.y]
field = "habitability_score"
aggregate = "avg"
label = "Avg habitability score"

[charts.interaction]
filterBy = "era"

[[charts]]
id = "avg_distance"
type = "number"
title = "Avg distance (ly)"
dataSource = "worlds"

[charts.encoding.y]
field = "distance_ly"
aggregate = "avg"
label = "Avg distance ly"

[charts.interaction]
filterBy = "era"

[[charts]]
id = "discovery_timeline"
type = "area"
title = "Discoveries over time"
dataSource = "worlds"
height = 260

[charts.encoding.x]
field = "discovery_year"
type = "ordinal"
label = "Discovery year"

[charts.encoding.y]
field = "planet"
aggregate = "count"
label = "Count"

[charts.interaction]
brush = true
brushAxis = "x"
publishes = "era"
filterBy = "era"

[[charts]]
id = "discovery_methods"
type = "donut"
title = "By discovery method"
dataSource = "worlds"
height = 260

[charts.encoding.x]
field = "method"
type = "nominal"
label = "Method"

[charts.encoding.y]
field = "planet"
aggregate = "count"
label = "Count"

[charts.interaction]
filterBy = "era"
publishes = "era"
select = "auto"

[[charts]]
id = "habitability_scatter"
type = "scatter"
title = "Habitability vs temperature"
dataSource = "worlds"
height = 280

[charts.encoding.x]
field = "equilibrium_k"
type = "quantitative"
label = "Equilibrium k"

[charts.encoding.y]
field = "habitability_score"
type = "quantitative"
label = "Habitability score"

[charts.encoding.color]
field = "method"
type = "nominal"

[charts.interaction]
filterBy = "era"

[[charts]]
id = "missions_bar"
type = "bar"
title = "Worlds by mission"
dataSource = "worlds"
height = 280

[charts.encoding.x]
field = "mission"
type = "nominal"
label = "Mission"

[charts.encoding.y]
field = "planet"
aggregate = "count"
label = "Count"

[charts.interaction]
filterBy = "era"

[layout]
type = "grid"
rows = [4, 2, 2]
gap = 16

[theme]
colors = ["#1e3a5f", "#7ba3c9", "#a89b8c", "#4a7c9b"]
fontFamily = "system-ui, -apple-system, \"Segoe UI\", sans-serif"
backgroundColor = "white"
