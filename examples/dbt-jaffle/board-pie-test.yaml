meta:
  title: "Payment Methods Analysis"
  description: "Pie chart demo from dbt-jaffle"
  version: "0.1.0"

data:
  - id: customer_orders
    type: dbt
    model: customer_orders

charts:
  # Pie chart
  - id: payment_pie
    type: pie
    dataSource: customer_orders
    title: "Revenue by Payment Method"
    encoding:
      x:
        field: payment_method
        type: nominal
        label: "Payment Method"
      y:
        field: amount
        type: quantitative
        label: "Total Revenue"
    width: 500
    height: 400
  
  # Donut chart
  - id: status_donut
    type: donut
    dataSource: customer_orders
    title: "Orders by Status"
    encoding:
      x:
        field: order_status
        type: nominal
        label: "Status"
      y:
        field: order_status
        type: quantitative
        aggregate: count
        label: "Count"
    width: 500
    height: 400

layout:
  type: flex
  gap: 24
