# Dash IR (canonical). Legacy board.yaml is deprecated; use this file for validate/preview/build.

id: dbt-jaffle
title: Jaffle Shop Analytics
description: Customer orders and payment analysis from dbt jaffle_shop
version: 0.1.0
meta:
  title: Jaffle Shop Analytics
  description: Customer orders and payment analysis from dbt jaffle_shop
  version: 0.1.0
data:
  - id: customer_orders
    type: dbt
    model: customer_orders
charts:
  - id: daily_revenue
    type: line
    title: Daily Revenue
    dataSource: customer_orders
    encoding:
      x:
        field: order_date
        type: temporal
        label: Order Date (brush to filter)
      y:
        field: amount
        type: quantitative
        aggregate: sum
        label: Total Revenue ($)
    interaction:
      brush: true
      brushAxis: x
      selection: dateBrush
      publishes: dateBrush
    width: 700
    height: 250
  - id: revenue_by_method
    type: bar
    title: Revenue by Payment Method
    dataSource: customer_orders
    encoding:
      x:
        field: payment_method
        type: nominal
        label: Payment Method
      y:
        field: amount
        type: quantitative
        aggregate: sum
        label: Total Revenue ($)
      color: steelblue
    interaction:
      filterBy: dateBrush
    width: 700
    height: 300
  - id: top_customers
    type: bar
    title: Revenue by Customer
    dataSource: customer_orders
    encoding:
      x:
        field: customer_name
        type: nominal
        label: Customer
      y:
        field: amount
        type: quantitative
        aggregate: sum
        label: Total Spent ($)
      color: darkorange
    interaction:
      filterBy: dateBrush
    width: 700
    height: 300
  - id: status_breakdown
    type: bar
    title: Orders by Status
    dataSource: customer_orders
    encoding:
      x:
        field: order_status
        type: nominal
        label: Status
      y:
        field: order_status
        type: quantitative
        aggregate: count
        label: Order Count
      color: mediumseagreen
    interaction:
      filterBy: dateBrush
    width: 700
    height: 300
layout:
  type: flex
  gap: 24
theme:
  colors:
    - steelblue
    - darkorange
    - mediumseagreen
  fontFamily: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif
coordination:
  auto: true
