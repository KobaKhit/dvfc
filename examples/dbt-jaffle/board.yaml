# DEPRECATED: Prefer jaffle.dash.yaml (Dash IR). This legacy board.yaml still loads via compat.
meta:
  title: "Jaffle Shop Analytics"
  description: "Customer orders and payment analysis from dbt jaffle_shop"
  version: "0.1.0"

data:
  - id: customer_orders
    type: dbt
    model: customer_orders

charts:
  # Time series with brush
  - id: daily_revenue
    type: line
    dataSource: customer_orders
    title: "Daily Revenue"
    encoding:
      x:
        field: order_date
        type: temporal
        label: "Order Date (brush to filter)"
      y:
        field: amount
        type: quantitative
        aggregate: sum
        label: "Total Revenue ($)"
    interaction:
      brush: true
      brushAxis: x
      selection: dateBrush
    width: 700
    height: 250

  # Revenue by payment method (filtered)
  - id: revenue_by_method
    type: bar
    dataSource: customer_orders
    title: "Revenue by Payment Method"
    encoding:
      x:
        field: payment_method
        type: nominal
        label: "Payment Method"
      y:
        field: amount
        type: quantitative
        aggregate: sum
        label: "Total Revenue ($)"
      color: "steelblue"
    interaction:
      filterBy: dateBrush
    width: 700
    height: 300

  # Top customers (filtered)
  - id: top_customers
    type: bar
    dataSource: customer_orders
    title: "Revenue by Customer"
    encoding:
      x:
        field: customer_name
        type: nominal
        label: "Customer"
      y:
        field: amount
        type: quantitative
        aggregate: sum
        label: "Total Spent ($)"
      color: "darkorange"
    interaction:
      filterBy: dateBrush
    width: 700
    height: 300

  # Order status breakdown (filtered)
  - id: status_breakdown
    type: bar
    dataSource: customer_orders
    title: "Orders by Status"
    encoding:
      x:
        field: order_status
        type: nominal
        label: "Status"
      y:
        field: order_status
        type: quantitative
        aggregate: count
        label: "Order Count"
      color: "mediumseagreen"
    interaction:
      filterBy: dateBrush
    width: 700
    height: 300

layout:
  type: flex
  gap: 24

theme:
  colors:
    - "steelblue"
    - "darkorange"
    - "mediumseagreen"
  fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
